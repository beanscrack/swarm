[workspace]
resolver = "3"
members = [
    "crates/swarm-core",
    "crates/swarm-store",
    "crates/swarm-providers",
    "crates/swarm-scheduler",
    "crates/swarm-tools",
    "crates/swarm-runtime",
    "crates/swarm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
swarm-core = { path = "crates/swarm-core" }
swarm-store = { path = "crates/swarm-store" }
swarm-providers = { path = "crates/swarm-providers" }
swarm-scheduler = { path = "crates/swarm-scheduler" }
swarm-tools = { path = "crates/swarm-tools" }
swarm-runtime = { path = "crates/swarm-runtime" }

# External crates (versions verified against crates.io on 2026-10-10)
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
futures = "0.3"
keyring = "4"
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm", "all-widgets"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
wiremock = "0.6"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
